<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <linearGradient id="lcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090E16" />
      <stop offset="100%" stop-color="#06090E" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
    .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Background Panel -->
  <rect width="1000" height="320" rx="16" fill="url(#lcBg)" />
  <rect x="1" y="1" width="998" height="318" rx="15" fill="none" stroke="#1E293B" stroke-width="1.2" />

  <!-- Header / Badge Banner -->
  <g transform="translate(28, 22)">
    <rect width="140" height="24" rx="6" fill="#111B28" stroke="#F59E0B" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="12" cy="12" r="4" fill="#F59E0B" />
    <text x="24" y="16" class="mono" fill="#F59E0B" font-size="10.5" font-weight="700" letter-spacing="1">LEETCODE LIVE</text>
    
    <text x="155" y="17" class="sans" fill="#F8FAFC" font-size="14" font-weight="700">Rahul-Raj-R</text>
    <text x="255" y="17" class="mono" fill="#64748B" font-size="11">leetcode.com/u/Rahul-Raj-R</text>

    <text x="945" y="17" text-anchor="end" class="mono" fill="#00F0FF" font-size="11" font-weight="700">GLOBAL RANK #458,335</text>
  </g>

  <line x1="28" y1="56" x2="972" y2="56" stroke="#1E293B" stroke-width="1" />

  <!-- Left: Donut Chart Section -->
  <g transform="translate(130, 175)">
    <!-- Background Circle Ring -->
    <circle cx="0" cy="0" r="76" fill="#0D1420" stroke="#1E293B" stroke-width="9" />
    <!-- Progress Arc: 318 / 1042 = ~30.5% of circumference 477.5 = 145.6 -->
    <circle cx="0" cy="0" r="76" fill="none" stroke="url(#ringGrad)" stroke-width="9" stroke-dasharray="146 478" stroke-dashoffset="0" stroke-linecap="round" transform="rotate(-90)" />
    
    <text x="0" y="-8" text-anchor="middle" class="sans" fill="#F8FAFC" font-size="34" font-weight="900">318</text>
    <text x="0" y="12" text-anchor="middle" class="mono" fill="#64748B" font-size="11" font-weight="600">/ 1042 SOLVED</text>
    <text x="0" y="32" text-anchor="middle" class="mono" fill="#10B981" font-size="10.5" font-weight="700">90.67% Acceptance</text>
    <text x="0" y="47" text-anchor="middle" class="mono" fill="#64748B" font-size="9">450 Submissions ? 2 Attempting</text>
  </g>

  <!-- Middle-Left: Breakdown Cards -->
  <g transform="translate(265, 75)">
    <!-- Easy -->
    <g transform="translate(0, 0)">
      <rect width="185" height="64" rx="8" fill="#0D1420" stroke="#10B981" stroke-opacity="0.3" stroke-width="1" />
      <text x="14" y="22" class="mono" fill="#10B981" font-size="11" font-weight="700">EASY</text>
      <text x="171" y="22" text-anchor="end" class="mono" fill="#64748B" font-size="10">20.0%</text>
      <text x="14" y="44" class="mono" fill="#F8FAFC" font-size="17" font-weight="700">192 <tspan fill="#64748B" font-size="11">/ 962</tspan></text>
      <rect x="14" y="52" width="157" height="4" rx="2" fill="#1E293B" />
      <rect x="14" y="52" width="31" height="4" rx="2" fill="#10B981" />
    </g>

    <!-- Medium -->
    <g transform="translate(0, 76)">
      <rect width="185" height="64" rx="8" fill="#0D1420" stroke="#F59E0B" stroke-opacity="0.3" stroke-width="1" />
      <text x="14" y="22" class="mono" fill="#F59E0B" font-size="11" font-weight="700">MEDIUM</text>
      <text x="171" y="22" text-anchor="end" class="mono" fill="#64748B" font-size="10">4.9%</text>
      <text x="14" y="44" class="mono" fill="#F8FAFC" font-size="17" font-weight="700">103 <tspan fill="#64748B" font-size="11">/ 2109</tspan></text>
      <rect x="14" y="52" width="157" height="4" rx="2" fill="#1E293B" />
      <rect x="14" y="52" width="12" height="4" rx="2" fill="#F59E0B" />
    </g>

    <!-- Hard -->
    <g transform="translate(0, 152)">
      <rect width="185" height="64" rx="8" fill="#0D1420" stroke="#EF4444" stroke-opacity="0.3" stroke-width="1" />
      <text x="14" y="22" class="mono" fill="#EF4444" font-size="11" font-weight="700">HARD</text>
      <text x="171" y="22" text-anchor="end" class="mono" fill="#64748B" font-size="10">2.4%</text>
      <text x="14" y="44" class="mono" fill="#F8FAFC" font-size="17" font-weight="700">23 <tspan fill="#64748B" font-size="11">/ 971</tspan></text>
      <rect x="14" y="52" width="157" height="4" rx="2" fill="#1E293B" />
      <rect x="14" y="52" width="8" height="4" rx="2" fill="#EF4444" />
    </g>
  </g>

  <!-- Middle-Right: Badges & Activity Overview -->
  <g transform="translate(470, 75)">
    <!-- Badges & Streak Row -->
    <rect width="235" height="104" rx="8" fill="#0D1420" stroke="#38BDF8" stroke-opacity="0.25" stroke-width="1" />
    <text x="16" y="22" class="mono" fill="#38BDF8" font-size="11" font-weight="700">BADGES &amp; STREAK</text>
    
    <g transform="translate(16, 36)">
      <text x="0" y="16" class="sans" fill="#A78BFA" font-size="18" font-weight="800">4 Badges</text>
      <text x="0" y="32" class="mono" fill="#64748B" font-size="10">50 Days Badge 2026</text>
    </g>

    <g transform="translate(125, 36)">
      <text x="0" y="16" class="sans" fill="#F59E0B" font-size="18" font-weight="800">28 Days</text>
      <text x="0" y="32" class="mono" fill="#64748B" font-size="10">Max Streak</text>
    </g>

    <!-- Submissions & Active Days Row -->
    <rect y="112" width="235" height="104" rx="8" fill="#0D1420" stroke="#10B981" stroke-opacity="0.25" stroke-width="1" />
    <text x="16" y="134" class="mono" fill="#10B981" font-size="11" font-weight="700">ANNUAL ACTIVITY</text>
    
    <g transform="translate(16, 148)">
      <text x="0" y="16" class="sans" fill="#F8FAFC" font-size="18" font-weight="800">386</text>
      <text x="0" y="32" class="mono" fill="#64748B" font-size="10">1-Yr Submissions</text>
    </g>

    <g transform="translate(125, 148)">
      <text x="0" y="16" class="sans" fill="#F8FAFC" font-size="18" font-weight="800">111</text>
      <text x="0" y="32" class="mono" fill="#64748B" font-size="10">Active Days</text>
    </g>
  </g>

  <!-- Right: Recent Accepted Problems List -->
  <g transform="translate(725, 75)">
    <rect width="245" height="216" rx="8" fill="#0D1420" stroke="#1E293B" stroke-width="1" />
    <text x="14" y="22" class="mono" fill="#F59E0B" font-size="11" font-weight="700">RECENT ACCEPTED (AC)</text>
    
    <!-- Item 1: Coin Change -->
    <g transform="translate(12, 34)">
      <rect width="221" height="38" rx="5" fill="#111B28" stroke="#1E293B" stroke-width="0.8" />
      <text x="10" y="17" class="sans" fill="#F8FAFC" font-size="12" font-weight="600">Coin Change</text>
      <text x="10" y="30" class="mono" fill="#64748B" font-size="9.5">Dynamic Programming</text>
      <rect x="175" y="11" width="38" height="16" rx="3" fill="#F59E0B" fill-opacity="0.15" />
      <text x="194" y="22" text-anchor="middle" class="mono" fill="#F59E0B" font-size="8.5" font-weight="700">Med</text>
    </g>

    <!-- Item 2: Divide Two Integers -->
    <g transform="translate(12, 78)">
      <rect width="221" height="38" rx="5" fill="#111B28" stroke="#1E293B" stroke-width="0.8" />
      <text x="10" y="17" class="sans" fill="#F8FAFC" font-size="12" font-weight="600">Divide Two Integers</text>
      <text x="10" y="30" class="mono" fill="#64748B" font-size="9.5">Math ? Bit Manipulation</text>
      <rect x="175" y="11" width="38" height="16" rx="3" fill="#F59E0B" fill-opacity="0.15" />
      <text x="194" y="22" text-anchor="middle" class="mono" fill="#F59E0B" font-size="8.5" font-weight="700">Med</text>
    </g>

    <!-- Item 3: Sort Colors -->
    <g transform="translate(12, 122)">
      <rect width="221" height="38" rx="5" fill="#111B28" stroke="#1E293B" stroke-width="0.8" />
      <text x="10" y="17" class="sans" fill="#F8FAFC" font-size="12" font-weight="600">Sort Colors</text>
      <text x="10" y="30" class="mono" fill="#64748B" font-size="9.5">Two Pointers ? Sorting</text>
      <rect x="175" y="11" width="38" height="16" rx="3" fill="#F59E0B" fill-opacity="0.15" />
      <text x="194" y="22" text-anchor="middle" class="mono" fill="#F59E0B" font-size="8.5" font-weight="700">Med</text>
    </g>

    <!-- Item 4: 3Sum -->
    <g transform="translate(12, 166)">
      <rect width="221" height="38" rx="5" fill="#111B28" stroke="#1E293B" stroke-width="0.8" />
      <text x="10" y="17" class="sans" fill="#F8FAFC" font-size="12" font-weight="600">3Sum</text>
      <text x="10" y="30" class="mono" fill="#64748B" font-size="9.5">Two Pointers ? Array</text>
      <rect x="175" y="11" width="38" height="16" rx="3" fill="#F59E0B" fill-opacity="0.15" />
      <text x="194" y="22" text-anchor="middle" class="mono" fill="#F59E0B" font-size="8.5" font-weight="700">Med</text>
    </g>
  </g>
</svg>